<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src https://cdn.keepwork.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>AIChat 桌面宠物</title><link rel="stylesheet" href="pet.css"></head><body>
<section id="panel" hidden aria-label="宠物聊天">
<header><strong id="title">AIChat</strong><button id="collapse" aria-label="收起">−</button></header>
<div id="messages" role="log" aria-live="polite"></div>
<div id="status" role="status"></div><div id="error" role="alert"></div>
<textarea id="draft" rows="3" maxlength="32000" placeholder="说点什么…" aria-label="消息"></textarea>
<div class="actions"><button id="dictation">语音输入</button><button id="call">通话</button><button id="mute" hidden>静音</button><button id="send">发送</button></div>
<button id="open">打开 AIChat ↗</button>
</section>
<button id="pet" aria-label="点击聊天，拖动移动" title="点击聊天 · 拖动移动"><span id="art">🥚</span><span id="badge" hidden>●</span></button>
<script src="pet.js"></script></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KeepWork 第二大脑</title>
  <style>
    :root {
      color-scheme: light;
      --launch-bg: #f7f8fb;
      --launch-text: #232833;
      --launch-muted: #71798b;
      --launch-border: #dfe3ee;
      --launch-surface: #ffffff;
      background: transparent;
      color: var(--launch-text);
      font: 14px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    :root[data-theme] { background: var(--launch-bg); }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --launch-bg: #18181f;
      --launch-text: #e5e7ef;
      --launch-muted: #a1a6b7;
      --launch-border: #383b48;
      --launch-surface: #242430;
    }
    /* Native backdrop already has the remembered appearance. Wait for the
       current profile snapshot before painting this document, also on recovery. */
    :root:not([data-theme]) body { visibility: hidden; background: transparent; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 36px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      background: var(--launch-bg);
    }
    main { width: 100%; max-width: 440px; margin: auto; text-align: center; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
      color: var(--launch-muted);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .brand-icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: #5364df;
      color: #ffffff;
      box-shadow: 0 4px 16px #5364df20;
    }
    h1 { margin: 0 0 10px; font-size: 23px; font-weight: 600; letter-spacing: -.02em; }
    p { margin: 0; color: var(--launch-muted); }
    .loading { width: 96px; height: 3px; margin: 28px auto 0; border-radius: 4px; background: var(--launch-border); overflow: hidden; }
    .loading::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: #7a86f0;
      animation: loading 1.6s ease-in-out infinite;
    }
    @keyframes loading { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
    @media (prefers-reduced-motion: reduce) { .loading::after { animation: none; margin: 0 auto; } }
    [data-state="unavailable"] .loading { display: none; }
    [hidden] { display: none !important; }
    .actions { display: flex; justify-content: center; gap: 10px; margin: 24px 0 20px; flex-wrap: wrap; }
    button {
      font: inherit;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--launch-border);
      background: var(--launch-surface);
      color: inherit;
      cursor: pointer;
    }
    button.primary { background: #5364df; border-color: #5364df; color: #ffffff; }
    button:disabled { opacity: .6; cursor: default; }
    :is(button, summary):focus-visible { outline: 2px solid #7a86f0; outline-offset: 3px; }
    #retry-status { margin-top: 16px; font-size: 12px; }
    #retry-status:empty { display: none; }
    details { margin-top: 18px; text-align: left; font-size: 12px; color: var(--launch-muted); }
    details summary { cursor: pointer; text-align: center; }
    #detail { margin-top: 12px; padding: 12px; border: 1px solid var(--launch-border); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main id="startup" data-state="connecting" aria-busy="true">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 18 18"><path d="M3.5 3h3v4.5L11 3h3.5L8.5 9l6 6H11L6.5 10.5V15H3.5z" fill="currentColor"/></svg></span>
      <span>KeepWork 第二大脑</span>
    </div>
    <h1 id="headline">正在打开工作台…</h1>
    <p id="summary">即将进入你的第二大脑。</p>
    <div class="loading" role="progressbar" aria-label="正在连接工作台"></div>
    <p id="retry-status" role="status" aria-live="polite"></p>
    <section id="recovery" hidden>
      <div class="actions">
        <button id="reload" class="primary" type="button">立即重试</button>
        <button id="updates" type="button">检查更新…</button>
      </div>
      <details>
        <summary>连接详情</summary>
        <p id="detail"></p>
      </details>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

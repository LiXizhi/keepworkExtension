<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KeepWork 第二大脑</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 34px 0 0;
      padding: 40px 24px;
      font: 14px/1.6 system-ui, -apple-system, sans-serif;
      background: light-dark(#f5f6fa, #181a21);
      color: light-dark(#232833, #e5e7ef);
    }
    main {
      max-width: 560px;
      margin: 48px auto;
      padding: 28px;
      border-radius: 14px;
      background: light-dark(#ffffff, #252832);
      border: 1px solid light-dark(#e1e4ed, #393e4c);
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 8px 0; color: light-dark(#5c6477, #adb4c7); }
    .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    button {
      font: inherit;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid light-dark(#cfd6e6, #42495a);
      background: light-dark(#ffffff, #2e3340);
      color: inherit;
      cursor: pointer;
    }
    button.primary {
      background: #395cda;
      border-color: #395cda;
      color: #ffffff;
    }
    #detail {
      margin-top: 14px;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="headline">正在连接 KeepWork 第二大脑…</h1>
    <p id="summary">正在启动本地 MCP 服务并打开聊天窗口。</p>
    <div class="actions">
      <button id="reload" class="primary" type="button">重新加载聊天窗口</button>
      <button id="updates" type="button">检查更新…</button>
    </div>
    <p id="detail"></p>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

[[permission]]
identifier = "allow-desktop-commands"
description = "Allows the trusted Keepwork main, pet and updates windows to use the desktop bridge commands."
commands.allow = [
  "desktop_browser_surface",
  "desktop_bumi_classroom",
  "desktop_page_connection_status",
  "desktop_retry_page_connection",
  "desktop_page_connection_attempt",
  "desktop_main_document_ready",
  "desktop_report_startup_signin",
  "desktop_get_launch_intent",
  "desktop_acknowledge_launch_intent",
  "desktop_reveal_pet_approval",
  "desktop_return_to_pet_after_approval",
  "desktop_present_pet_camera",
  "desktop_capture_screenshot",
  "desktop_get_screenshot_permission",
  "desktop_set_screenshot_permission",
  "desktop_publish_pet_state",
  "desktop_pet_result",
  "desktop_pet_audio",
  "desktop_pet_audio_event",
  "desktop_check_git",
  "desktop_install_git",
  "desktop_roots",
  "desktop_pick_folder",
  "desktop_save_markdown_export",
  "desktop_default_brain_folder",
  "desktop_revoke_folder",
  "desktop_file",
  "desktop_terminal",
  "desktop_status",
  "desktop_check_updates",
  "desktop_install_update",
  "desktop_run_menu_command",
  "desktop_open_menu",
  "desktop_set_menu_language",
  "desktop_titlebar_action",
  "desktop_sync_theme",
  "desktop_pet_action",
  "remote_voice_dialogue_closed",
  "updates_window_status",
  "updates_window_check",
  "updates_window_apply_mcp",
  "updates_window_apply_desktop",
]

[[permission]]
identifier = "allow-remote-voice-settings"
description = "Allows only the local remote-voice settings window to manage its worker."
commands.allow = [
  "remote_voice_status",
  "remote_voice_set_demo_mode",
  "remote_voice_enter_demo",
  "remote_voice_start",
  "remote_voice_stop",
  "remote_voice_begin_input",
  "remote_voice_set_auto_start",
  "remote_voice_refresh_devices",
]

[[permission]]
identifier = "allow-bumi-control"
description = "Allows the bundled Bumi window to discover and operate a selected robot and connect its Box Link device."
commands.allow = ["bumi_control", "bumi_remote_input", "bumi_chat_handoff", "bumi_box_link"]

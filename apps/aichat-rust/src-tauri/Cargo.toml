[package]
name = "aichat-rust"
version = "0.2.81"
description = "KeepWork 第二大脑 (AIChat Desktop) — Rust + Tauri 2 native desktop application"
authors = ["Keepwork"]
edition = "2021"
default-run = "Keepwork"

[lib]
name = "aichat_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[features]
default = []
dev-bins = []

[[bin]]
# macOS uses the executable name for the Dock label during unbundled development.
name = "Keepwork"
path = "src/main.rs"

[[bin]]
name = "desktop-smoke"
path = "src/bin/desktop_smoke.rs"
required-features = ["dev-bins"]

[[bin]]
name = "runtime-smoke"
path = "src/bin/runtime_smoke.rs"
required-features = ["dev-bins"]

[[bin]]
name = "pty-smoke"
path = "src/bin/pty_smoke.rs"
required-features = ["dev-bins"]

[[bin]]
name = "pet-smoke"
path = "src/bin/pet_smoke.rs"
required-features = ["dev-bins"]

[[bin]]
name = "pet-canvas-smoke"
path = "src/bin/pet_canvas_smoke.rs"
required-features = ["dev-bins"]

[[bin]]
name = "updates-smoke"
path = "src/bin/updates_smoke.rs"
required-features = ["dev-bins"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[target.'cfg(windows)'.build-dependencies]
dunce = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "io-std", "sync", "time", "macros", "rt-multi-thread", "fs", "net"] }
dirs = "6"
dunce = "1"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
url = "2"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
btleplug = "=0.13.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
junction = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Accessibility", "Devices_Bluetooth", "Devices_Enumeration", "Foundation"] }
windows-collections = "0.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader"] }

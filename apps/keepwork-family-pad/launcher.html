function renderCalendar(target=document.getElementById('calendar-panel')){
  const $=id=>id==='calendar-panel'?target:target.querySelector('#'+id);
  const chosen=dates[profile]||dateKey();dates[profile]=chosen;
  const [year,month]=chosen.split('-').map(Number),first=new Date(year,month-1,1),count=new Date(year,month,0).getDate(),pad=(first.getDay()+6)%7;
  const rows=events().filter(e=>e.date===chosen).sort((a,b)=>a.time.localeCompare(b.time));
  const weekdays=lang==='zh'?['一','二','三','四','五','六','日']:['M','T','W','T','F','S','S'];
  $('calendar-panel').innerHTML=`<div class="calendar-title"><h2>${pname()}${t('calendar')}</h2><button id="add-event" aria-label="${t('addEvent')}">+</button></div><p class="calendar-caption">${t('calendarLocal')}</p><div class="month-nav"><button id="prev-month" aria-label="${lang==='zh'?'上个月':'Previous month'}">‹</button><strong>${first.toLocaleDateString(lang==='zh'?'zh-CN':'en-GB',{year:'numeric',month:'long'})}</strong><button class="today-button" id="calendar-today">${t('today')}</button><button id="next-month" aria-label="${lang==='zh'?'下个月':'Next month'}">›</button></div><div class="calendar-grid">${weekdays.map(x=>`<span class="weekday">${x}</span>`).join('')}${'<span></span>'.repeat(pad)}${Array.from({length:count},(_,i)=>{const key=dateKey(new Date(year,month-1,i+1));return `<button class="day ${key===chosen?'chosen':''} ${key===dateKey()?'today':''} ${events().some(e=>e.date===key)?'has-event':''}" data-day="${key}" aria-label="${key}" aria-pressed="${key===chosen}">${i+1}</button>`}).join('')}</div><div class="agenda-date">${chosen} · ${lang==='zh'?'我的安排':'My agenda'}</div><div class="agenda-list">${rows.length?rows.map(e=>`<button class="agenda-item" data-event="${esc(e.id)}"><span class="agenda-time">${esc(e.time)}</span><span class="agenda-name">${esc(e.title)}</span></button>`).join(''):`<p class="calendar-empty">${t('nothing')}</p><button class="empty-add" id="empty-add">+ ${t('addEvent')}</button>`}</div>`;
  target.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{dates[profile]=b.dataset.day;renderCalendar(target)});

function eventModal(id){
  const owner=profile,existing=events().find(e=>e.id===id);
  modal(`${modalHead(t(existing?'editEvent':'addEvent'))}<p>${pname()}${t('calendar')} · ${t('calendarLocal')}</p><form class="event-form" id="event-form"><label>${t('eventTitle')}<input id="event-title" required maxlength="80" value="${esc(existing?.title||'')}" autocomplete="off"></label><div class="event-fields"><label>${t('eventDate')}<input id="event-date" type="date" required value="${esc(existing?.date||dates[profile]||dateKey())}"></label><label>${t('eventTime')}<input id="event-time" type="time" required value="${esc(existing?.time||'16:00')}"></label></div><div class="event-actions"><button class="primary" type="submit">${t('eventSave')}</button>${existing?`<button class="delete-event" id="delete-event" type="button">${t('eventDelete')}</button>`:''}</div></form>`);
  $('close-modal').onclick=()=>closeModal();
  $('event-form').onsubmit=e=>{e.preventDefault();const title=$('event-title').value.trim();if(!title){$('event-title').focus();return}const entry={id:existing?.id||crypto.randomUUID(),title,date:$('event-date').value,time:$('event-time').value};calendars[owner]=(Array.isArray(calendars[owner])?calendars[owner]:[]).filter(x=>x.id!==entry.id);calendars[owner].push(entry);dates[owner]=entry.date;save();closeModal();renderCalendar()};
  if($('delete-event'))$('delete-event').onclick=()=>{calendars[owner]=calendars[owner].filter(x=>x.id!==existing.id);save();closeModal();renderCalendar()};
  $('event-title').focus();
}

 screen='guide';chrome();const zh=lang==='zh';let title='',lead='',main='';
 if(guidePage===0){title=t('whatBrain');lead=t('guideIntro');const topics=zh?[['探索','连接知识与未知','跟着好奇心，走进一个世界。','在哈奇世界遇见一个角色，用新的语言问一句“你来自哪里？”','一次探索 → 一个新问题 → 一段自己的发现'],['学习','积累经验与理解','把经历，变成自己的理解。','记录练习过的表达、遇到的问题与得到的答案，下一次从这里继续。','一次练习 → 一份理解 → 可继续积累的知识'],['创造','让想法成为作品','让一个念头，有自己的形状。','把想法写成故事、做成作品，或把人生经历整理成可以回看的一段记忆。','一个想法 → 一次创作 → 属于自己的作品']]:[['Explore','Connect knowledge and the unknown','Follow your curiosity into a world.','Meet a character in Haqi and ask where they come from in a new language.','An encounter → A question → Your discovery'],['Learn','Build experience and understanding','Turn experience into understanding.','Keep the expressions, questions and answers you discover. Continue from there next time.','Practice → Understanding → Personal knowledge'],['Create','Turn ideas into works','Give an idea a shape.','Write a story, make a work, or turn a life experience into a memory you can revisit.','An idea → Creation → Your own work']];const current=topics[guideTopic];main=`<div class="guide-choices">${topics.map((a,i)=>`<button class="guide-choice ${i===guideTopic?'chosen':''}" data-guide-topic="${i}" aria-pressed="${i===guideTopic}"><b>${a[0]}</b><span>${a[1]}</span></button>`).join('')}</div><div class="guide-example"><div><h2>${current[2]}</h2><p>${current[3]}</p></div><div class="guide-result"><small>${zh?'互动示例':'ILLUSTRATIVE EXAMPLE'}</small>${current[4]}</div></div>`}
 if(guidePage===1){title=zh?'大脑，在与世界的互动中逐渐形成。':'A brain grows through interaction with the world.';lead=zh?'我们的生物脑在物理世界中，经过多年的经历与学习逐渐构建；数字第二大脑，也需要在数字与物理世界中持续积累。':'Our biological brains grow through years of experience. A digital second brain also grows through continued interaction and accumulation.';const tracks=zh?[['生物脑','物理世界','人与事物 · 真实经历','多年探索与学习','观察 · 行动 · 记忆','独特的自己','经验 · 理解 · 创造力'],['数字第二大脑','数字 / 物理世界','公共数字世界 + 连接配件','持续互动与积累','探索 · 学习 · 讲述 · 创造','自己的第二大脑','个人知识 · 记忆 · 作品']]:[['Biological brain','Physical world','People, things and experiences','Years of learning','Observe · Act · Remember','Your unique self','Experience and creativity'],['Digital second brain','Digital / physical worlds','Shared worlds and connected devices','Ongoing interaction','Explore · Learn · Tell · Create','Your second brain','Knowledge · Memories · Works']];main=tracks.map((a,i)=>`<div class="growth-row ${i?'digital':''}"><strong>${a[0]}</strong><div><b>${a[1]}</b><small>${a[2]}</small></div><i>→</i><div><b>${a[3]}</b><small>${a[4]}</small></div><i>→</i><div><b>${a[5]}</b><small>${a[6]}</small></div></div>`).join('')+`<div class="guide-info"><div><b>${zh?'共享超级大脑是什么？':'What is the shared brain?'}</b><p>${zh?'持续维护并与用户共创的公共知识、场景、角色和资源，形成可以探索、学习与创造的公共数字世界。':'Shared knowledge, scenes, characters and resources create a world to explore, learn in and create with.'}</p></div><div><b>${zh?'我的第二大脑如何生长？':'How does my second brain grow?'}</b><p>${zh?'你在世界中的发现、讲述与作品逐步积累。个人记忆独立保存，只有经授权、审核的内容才进入公共层。':'Your discoveries, stories and works accumulate. Personal memories stay private; only authorized, reviewed content enters the shared layer.'}</p></div></div>`}
 if(guidePage===2){title=zh?'从自己的世界，开始积累。':'Start building in your own world.';lead=zh?'孩子在哈奇中探索与学习，长辈在人生几何中讲述与回忆。我的数字大脑帮助整理，个人日历安排下一步。':'Children explore and learn in Haqi. Elders revisit and tell their life stories. My Digital Brain helps organize, while a personal calendar makes room for the next step.';const child=guideWorld==='child',app=APPS[child?'haqi':'life'];main=`<div class="guide-worlds"><button data-guide-world="child" class="${child?'chosen':''}">${zh?'孩子的世界':'A child’s world'}</button><button data-guide-world="elder" class="${!child?'chosen':''}">${zh?'长辈的世界':'An elder’s world'}</button></div><div class="guide-world-panel"><div class="guide-world-image" style="background-image:url('${app.image}')" role="img" aria-label="${child?t('haqi'):t('life')}"></div><div class="guide-world-copy"><h2>${child?t('haqi'):t('life')}</h2><p>${zh?(child?'今天，和哈奇伙伴练习一句新的表达。明天，还能从自己的发现继续探索。':'走进熟悉的年代，讲一段小时候的故事。把回忆留在自己的声音里。'):(child?'Practice a new expression with your Haqi companion. Tomorrow, continue from your own discoveries.':'Step into a familiar era and tell a childhood story. Keep a memory in your own voice.')}</p><button class="guide-save" id="guide-save" ${guideSaved[guideWorld]?'disabled':''}>${guideSaved[guideWorld]?(zh?'已加入示例脑':'Added to example brain'):(zh?(child?'试一试：留下一次探索 +':'试一试：留下一段回忆 +'):'Try it: add a memory +')}</button><div class="guide-saved" role="status">${guideSaved[guideWorld]?(zh?(child?'我的发现：用新语言认识了一位伙伴。':'我的回忆：小时候，家门口有一棵大树。'):'My example memory is here. I can keep building on it.'):''}</div></div></div><p class="guide-privacy">${zh?'这是新手互动示例，不会写入真实个人脑。公共世界提供起点，你的经历让它成为自己的第二大脑。':'An onboarding example only; nothing is saved to a real personal brain. Shared worlds provide a beginning. Your experiences make it yours.'}</p>`}
 $('view').innerHTML=`<section class="guide-canvas"><nav class="guide-nav"><button class="guide-back" id="guide-return">${icon('back')}${zh?'返回原步骤':'Back to setup'}</button><small>${t('padName')} · ${zh?'新手指引':'GETTING STARTED'} · ${guidePage+1}/3</small></nav><header class="guide-heading"><h1>${title}</h1><p>${lead}</p></header><div class="guide-main">${main}</div><footer class="guide-controls"><div class="guide-dots">${[0,1,2].map(i=>`<button data-guide-page="${i}" class="${i===guidePage?'current':''}" aria-label="${zh?'第':'Step '}${i+1}${zh?'页':''}"></button>`).join('')}</div><button class="primary" id="guide-next">${guidePage===2?(zh?'开始我的第二大脑':'Start my second brain'):(zh?'继续了解':'Continue')}${icon('arrow')}</button></footer></section>`;
 $('guide-return').onclick=returnGuide;$('guide-next').onclick=()=>{if(guidePage===2)returnGuide();else{guidePage++;renderGuide()}};document.querySelectorAll('[data-guide-page]').forEach(b=>b.onclick=()=>{guidePage=Number(b.dataset.guidePage);renderGuide()});document.querySelectorAll('[data-guide-topic]').forEach(b=>b.onclick=()=>{guideTopic=Number(b.dataset.guideTopic);renderGuide()});document.querySelectorAll('[data-guide-world]').forEach(b=>b.onclick=()=>{guideWorld=b.dataset.guideWorld;renderGuide()});if($('guide-save'))$('guide-save').onclick=()=>{guideSaved[guideWorld]=true;renderGuide()};fitGuide();
}
window.addEventListener('resize',fitGuide);


function previewProfile(type){const id=Object.keys(PROFILES).find(id=>PROFILES[id].type===type);if(id){profile=id;saved.demoSignedIn=true;home()}else{step=3;saved.demoSignedIn=true;setup();newUserWizard(setup,type)}}
function newUserWizard(done,initialType){
 let identity=initialType||'child',stage=0,name='',world='haqi';
 const labels={zh:['哥哥','姐姐','孩子','爸爸','妈妈','爷爷','奶奶','弟弟','妹妹','外公','外婆'],en:['Brother','Sister','Child','Dad','Mom','Grandpa','Grandma','Little brother','Little sister','Grandad','Nana']};
 function render(){const zh=lang==='zh';modal(`${modalHead(t('newUser'))}<div class="wizard-progress">${stage===0?'01 / 02':'02 / 02'} · ${t(stage===0?'chooseIdentity':'chooseLabel')}</div>${stage===0?`<p>${t('identityNote')}</p><div class="identity-options">${['child','adult','elder'].map(x=>`<button data-identity="${x}" class="identity-option ${identity===x?'selected':''}" aria-pressed="${identity===x}"><span class="avatar ${x==='elder'?'elder':x==='adult'?'adult':''}">${x==='child'?'✦':x==='adult'?'◈':'❋'}</span><strong>${t(x+'Type')}</strong></button>`).join('')}</div><button class="primary" id="identity-next">${t('next')}${icon('arrow')}</button>`:`<p>${t(identity+'Type')} · ${t('chooseLabel')}</p><div class="name-tags">${labels[lang].map(label=>`<button type="button" data-name="${esc(label)}" class="${name===label?'chosen':''}">${label}</button>`).join('')}</div><form id="new-user-form"><label class="name-label" for="new-user-name">${t('diyName')}</label><input id="new-user-name" maxlength="24" required value="${esc(name)}" placeholder="${t('namePlaceholder')}" autocomplete="off">${identity==='adult'?`<label class="name-label" for="user-world">${zh?'我的数字世界':'My digital world'}</label><select id="user-world"><option value="life">${t('life')}</option><option value="haqi">${t('haqi')}</option></select>`:''}<p class="form-error" id="user-error" role="status"></p><div class="new-user-actions"><button type="button" class="secondary" id="identity-back">${t('back')}</button><button type="submit" class="primary">${t('createUser')}${icon('arrow')}</button></div></form>`}`);
 $('close-modal').onclick=()=>{closeModal();done()};
 if(stage===0){document.querySelectorAll('[data-identity]').forEach(b=>b.onclick=()=>{identity=b.dataset.identity;render()});$('identity-next').onclick=()=>{world=identity==='child'?'haqi':'life';stage=1;render()}}
 else{if($('user-world')){$('user-world').value=world;$('user-world').onchange=()=>world=$('user-world').value}document.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{name=b.dataset.name;$('new-user-name').value=name;document.querySelectorAll('[data-name]').forEach(el=>el.classList.toggle('chosen',el===b))});$('new-user-name').oninput=()=>{name=$('new-user-name').value;document.querySelectorAll('[data-name]').forEach(el=>el.classList.toggle('chosen',el.dataset.name===name))};$('identity-back').onclick=()=>{stage=0;render()};$('new-user-form').onsubmit=e=>{e.preventDefault();name=$('new-user-name').value.trim();if(!name){$('user-error').textContent=t('userNameError');return}const id='user-'+crypto.randomUUID();PROFILES[id]={name:name.slice(0,24),type:identity,world,avatar:String(Object.keys(PROFILES).length+1).padStart(2,'0').slice(-2)};selected=id;if(!PROFILES[profile])profile=id;profilePage=Math.floor((Object.keys(PROFILES).length-1)/3);save();closeModal();done()}}
 }render();
}

function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;$('toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function setLang(value){lang=value;save();if(screen==='setup')setup();else if(screen==='home')home();else if(screen==='boot')boot();else if(screen==='guide')renderGuide();else chrome()}
$('replay').onclick=()=>boot(true);$('show-child').onclick=()=>{previewProfile('child')};$('show-elder').onclick=()=>{previewProfile('elder')};$('lang-toggle').onclick=()=>setLang(lang==='zh'?'en':'zh');$('home-button').onclick=()=>{if(screen==='guide'){returnGuide();return}if(screen==='home')return;if(screen==='app'||saved.configured)home();else{step=saved.demoSignedIn?3:2;setup()}};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('device').requestFullscreen()}catch{toast(t('fullscreenFail'))}};$('modal-backdrop').onclick=e=>{if(e.target===$('modal-backdrop'))closeModal()};document.addEventListener('keydown',e=>{if(!$('modal-backdrop').classList.contains('hidden')){if(e.key==='Escape')closeModal();if(e.key==='Tab'){const list=[...$('modal').querySelectorAll('button,a,input')];const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}else if(e.key==='Escape'&&screen==='guide')returnGuide();else if(e.key==='Escape'&&screen==='app')home()});window.addEventListener('online',()=>{if(screen==='setup'&&step===1)setup()});window.addEventListener('offline',()=>{if(screen==='setup'&&step===1)setup()});setInterval(clock,15000);boot();
</script>

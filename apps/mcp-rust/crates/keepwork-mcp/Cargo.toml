[package]
name = "keepwork-mcp"
version = "0.2.64"
description = "Keepwork local MCP daemon (Rust)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "keepwork-mcp"
path = "src/main.rs"

[lib]
name = "keepwork_mcp"
path = "src/lib.rs"

[features]
default = []
# Also allows the legacy capability contract to be tested on current systems.
win7-compat = []

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
encoding_rs = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gethostname = "0.5"
percent-encoding = "2"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "process", "io-util"] }
tokio-stream = { version = "0.1", features = ["time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
unicode-normalization = "0.1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
sha2 = "0.10"

[target.'cfg(not(target_vendor = "win7"))'.dependencies]
dirs = "6"
portable-pty = "0.8"

name: Build KeepWork 第二大脑
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish installers and promote desktop updates
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: aichat-desktop-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    environment: aichat-desktop-production
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: win32, arch: x64, runtime: windows-x64 }
          - { runner: macos-15, platform: darwin, arch: arm64, runtime: macos-arm64 }
          - { runner: macos-15-intel, platform: darwin, arch: x64, runtime: macos-x64 }
    runs-on: ${{ matrix.runner }}
    env:
      KP_RUNTIME_NODE_VERSION: 22.23.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.23.2', architecture: '${{ matrix.arch }}' }
      - run: npm ci
      - run: npm ci --prefix apps/mcp-runtime
      - run: npm ci --prefix apps/aichat-desktop
      - run: npm run check:shared
      - run: npm run check --prefix apps/aichat-desktop
      - run: node apps/aichat-desktop/scripts/native-smoke.cjs
      - run: npm run stage --prefix apps/mcp-runtime -- --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}'
      - run: npm run smoke --prefix apps/mcp-runtime
      - name: Set runtime path
        run: echo "AICHAT_MCP_RUNTIME_DIR=$GITHUB_WORKSPACE/apps/mcp-runtime/staging/${{ matrix.runtime }}" >> "$GITHUB_ENV"
      - name: Configure signed Mac release
        if: matrix.platform == 'darwin' && inputs.publish
        env:
          KP_MAC_CSC_LINK: ${{ secrets.KP_MAC_CSC_LINK }}
          KP_MAC_CSC_KEY_PASSWORD: ${{ secrets.KP_MAC_CSC_KEY_PASSWORD }}
          KP_APPLE_ID: ${{ secrets.KP_APPLE_ID }}
          KP_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.KP_APPLE_APP_SPECIFIC_PASSWORD }}
          KP_APPLE_TEAM_ID: ${{ secrets.KP_APPLE_TEAM_ID }}
        run: |
          for name in KP_MAC_CSC_LINK KP_MAC_CSC_KEY_PASSWORD KP_APPLE_ID KP_APPLE_APP_SPECIFIC_PASSWORD KP_APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then echo "Missing required Mac release secret: $name" >&2; exit 1; fi
          done
          echo "CSC_LINK=$KP_MAC_CSC_LINK" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$KP_MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_ID=$KP_APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=$KP_APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$KP_APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - name: Package desktop
        working-directory: apps/aichat-desktop
        run: |
          if [[ '${{ matrix.platform }}' == win32 ]]; then npm run make:win; else npm run make:mac -- --${{ matrix.arch }}; fi
      - name: Verify Mac application signature and notarization
        if: matrix.platform == 'darwin'
        working-directory: apps/aichat-desktop
        run: |
          app=$(find release -maxdepth 2 -name '*.app' -print -quit)
          codesign --verify --deep --strict --verbose=2 "$app"
          if [[ '${{ inputs.publish }}' == 'true' ]]; then
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/aichat-desktop/release/*.exe
            apps/aichat-desktop/release/*.zip
            apps/aichat-desktop/release/*.blockmap
            apps/aichat-desktop/release/latest*.yml
  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment: aichat-desktop-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/download-artifact@v4
        with: { pattern: 'desktop-*', path: desktop-release }
      - name: Upload binaries before promoting each platform feed
        env:
          KP_QINIU_ACCESS_KEY: ${{ secrets.KP_QINIU_ACCESS_KEY }}
          KP_QINIU_SECRET_KEY: ${{ secrets.KP_QINIU_SECRET_KEY }}
        run: |
          for target in win32-x64 darwin-arm64 darwin-x64; do
            node scripts/publish-desktop.cjs --dir "desktop-release/desktop-$target" --target "$target"
          done

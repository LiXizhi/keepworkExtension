name: Build KeepWork 第二大脑
run-name: ${{ inputs.publisher_id && format('publisher-{0}', inputs.publisher_id) || github.event.head_commit.message || 'Desktop build' }}
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish installers and promote desktop updates
        type: boolean
        default: false
      release_build:
        description: Build release-quality artifacts for the local publisher (no CDN upload)
        type: boolean
        default: false
      source_sha:
        description: Expected main commit for the local publisher
        type: string
        default: ''
      publisher_id:
        description: Unique local publisher run ID
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: aichat-desktop-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[prepare desktop release]')
    environment: aichat-desktop-production
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: win32, arch: x64, runtime: windows-x64 }
          - { runner: macos-15, platform: darwin, arch: arm64, runtime: macos-arm64 }
          - { runner: macos-15-intel, platform: darwin, arch: x64, runtime: macos-x64 }
    runs-on: ${{ matrix.runner }}
    env:
      KP_RUNTIME_NODE_VERSION: 22.23.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.23.2', architecture: '${{ matrix.arch }}' }
      - name: Validate local publisher request
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
          PUBLISHER_ID: ${{ inputs.publisher_id }}
          RELEASE_BUILD: ${{ inputs.release_build }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          node -e 'const e=process.env; if(e.RELEASE_BUILD==="true" && (e.PUBLISH==="true" || !/^[a-zA-Z0-9-]+$/.test(e.PUBLISHER_ID) || e.EXPECTED_SHA!==e.GITHUB_SHA || e.GITHUB_REF!=="refs/heads/main")) throw Error("Invalid local publisher request")'
      - run: npm ci
      - run: npm ci --prefix apps/mcp-runtime
      - run: npm ci --prefix apps/local-model-runtime
      - run: npm ci --prefix apps/aichat-desktop
      - run: npm run check:shared
      - run: npm run check --prefix apps/aichat-desktop
      - run: node apps/aichat-desktop/scripts/native-smoke.cjs
      - run: npm run stage --prefix apps/mcp-runtime -- --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}'
      - run: npm run smoke --prefix apps/mcp-runtime
      - run: npm run runtime:stage --prefix apps/local-model-runtime -- --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}'
      - run: npm run runtime:smoke --prefix apps/local-model-runtime -- runtime-staging/${{ matrix.runtime }}
      - name: Set runtime path
        run: |
          echo "AICHAT_MCP_RUNTIME_DIR=$GITHUB_WORKSPACE/apps/mcp-runtime/staging/${{ matrix.runtime }}" >> "$GITHUB_ENV"
          echo "KP_LOCAL_MODEL_RUNTIME_DIR=$GITHUB_WORKSPACE/apps/local-model-runtime/runtime-staging/${{ matrix.runtime }}" >> "$GITHUB_ENV"
      - name: Configure signed Mac release
        if: matrix.platform == 'darwin' && (inputs.publish || inputs.release_build || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish desktop]')))
        env:
          KP_MAC_CSC_LINK: ${{ secrets.KP_MAC_CSC_LINK }}
          KP_MAC_CSC_KEY_PASSWORD: ${{ secrets.KP_MAC_CSC_KEY_PASSWORD }}
          KP_APPLE_ID: ${{ secrets.KP_APPLE_ID }}
          KP_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.KP_APPLE_APP_SPECIFIC_PASSWORD }}
          KP_APPLE_TEAM_ID: ${{ secrets.KP_APPLE_TEAM_ID }}
        run: |
          if [[ -n "$KP_MAC_CSC_LINK" && -n "$KP_MAC_CSC_KEY_PASSWORD" && -n "$KP_APPLE_ID" && -n "$KP_APPLE_APP_SPECIFIC_PASSWORD" && -n "$KP_APPLE_TEAM_ID" ]]; then
            echo "CSC_LINK=$KP_MAC_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$KP_MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_ID=$KP_APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$KP_APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$KP_APPLE_TEAM_ID" >> "$GITHUB_ENV"
            echo "KP_MAC_RELEASE_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "Apple signing secrets unavailable; publishing Mac with a coherent ad-hoc signature. System Settings approval may be required."
            echo "KP_MAC_RELEASE_SIGNED=false" >> "$GITHUB_ENV"
          fi
      - name: Package desktop
        working-directory: apps/aichat-desktop
        run: |
          if [[ '${{ matrix.platform }}' == win32 ]]; then npm run make:win; else npm run make:mac -- --${{ matrix.arch }}; fi
      - name: Verify Mac application signature and notarization
        if: matrix.platform == 'darwin'
        working-directory: apps/aichat-desktop
        run: |
          app=$(find release -maxdepth 2 -name '*.app' -print -quit)
          codesign --verify --deep --strict --verbose=2 "$app"
          if [[ "$KP_MAC_RELEASE_SIGNED" == 'true' ]]; then
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          fi
      - name: Record artifact provenance
        env:
          KP_PUBLISHER_ID: ${{ inputs.publisher_id }}
          KP_DESKTOP_TARGET: ${{ matrix.platform }}-${{ matrix.arch }}
        run: node scripts/desktop-build-info.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/aichat-desktop/release/*.exe
            apps/aichat-desktop/release/*.zip
            apps/aichat-desktop/release/*.blockmap
            apps/aichat-desktop/release/latest*.yml
            apps/aichat-desktop/release/publisher-build.json
  publish:
    if: inputs.publish || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish desktop]'))
    needs: build
    runs-on: ubuntu-latest
    environment: aichat-desktop-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: actions/download-artifact@v4
        with: { pattern: 'desktop-*', path: desktop-release }
      - name: Upload binaries before promoting each platform feed
        env:
          KP_QINIU_ACCESS_KEY: ${{ secrets.KP_QINIU_ACCESS_KEY }}
          KP_QINIU_SECRET_KEY: ${{ secrets.KP_QINIU_SECRET_KEY }}
        run: |
          for target in win32-x64 darwin-arm64 darwin-x64; do
            node scripts/publish-desktop.cjs --dir "desktop-release/desktop-$target" --target "$target"
          done

name: Build and publish KP Local Helper for Windows

on:
  push:
    branches: [main]
    paths:
      - apps/local-helper/package.json
      - apps/local-model-runtime/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kp-local-helper-windows-release
  cancel-in-progress: false

env:
  KP_HELPER_PUBLISH_URL: https://cdn.keepwork.com/keepwork/KeepworkExtension-Windows-Setup
  KP_QINIU_BUCKET: haqi
  KP_QINIU_DOMAIN: https://cdn.keepwork.com
  KP_QINIU_UPLOAD_HOST: https://up-z2.qiniup.com
  KP_QINIU_PREFIX: keepwork/KeepworkExtension-Windows-Setup/

jobs:
  release-gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      previous_version: ${{ steps.version.outputs.previous_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Local Helper release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: >-
          node apps/local-helper/scripts/check-release-version.cjs
          --event "$EVENT_NAME"
          --before-sha "${BEFORE_SHA:-0000000000000000000000000000000000000000}"
          --package-path apps/local-helper/package.json
          --coupled-path apps/local-model-runtime
          --output "$GITHUB_OUTPUT"

  build-and-publish-windows-x64:
    needs: release-gate
    if: needs.release-gate.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/vscode-extension/package-lock.json
            apps/local-helper/package-lock.json
            apps/local-model-runtime/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix apps/vscode-extension
          npm ci --prefix apps/local-helper
          npm ci --prefix apps/local-model-runtime

      - name: Compile and test all package boundaries
        run: |
          npm run check:shared
          npm --prefix apps/vscode-extension run check
          npm --prefix apps/local-helper run check
          npm --prefix apps/local-model-runtime run check
          npm --prefix apps/local-model-runtime test

      - name: Verify VSIX excludes local-model
        shell: pwsh
        run: |
          Push-Location apps/vscode-extension
          npx --no-install vsce package --out "$env:RUNNER_TEMP/keepwork-boundary.vsix"
          Pop-Location
          node apps/vscode-extension/scripts/assert-vsix-boundary.cjs "$env:RUNNER_TEMP/keepwork-boundary.vsix"

      - name: Stage local-model runtime
        run: npm --prefix apps/local-model-runtime run runtime:stage -- --platform win32 --arch x64

      - name: Smoke-test staged local-model runtime
        run: npm --prefix apps/local-model-runtime run runtime:smoke -- runtime-staging/windows-x64

      - name: Create private build configuration
        shell: pwsh
        run: |
          $settings = @{
            KP_WINDOWS_CSC_LINK = ''
            KP_WINDOWS_CSC_KEY_PASSWORD = ''
            KP_WINDOWS_CERT_SUBJECT = ''
            KP_REQUIRE_CODE_SIGNING = $false
            KP_HELPER_PUBLISH_URL = $env:KP_HELPER_PUBLISH_URL
            KP_LOCAL_MODEL_RUNTIME_DIR = "../local-model-runtime/runtime-staging/windows-x64"
          }
          $settings | ConvertTo-Json | Set-Content -Encoding utf8 apps/local-helper/build.local.json

      - name: Build unsigned NSIS installer
        run: npm --prefix apps/local-helper run make:win

      - name: Install and smoke-test the unified Helper
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          $installer = (Resolve-Path "apps/local-helper/release/KP-Local-Helper-Setup-$env:RELEASE_VERSION-x64.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "kp-local-helper-installed"
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "installer exited with $($process.ExitCode)" }
          $helper = Join-Path $installDir 'KP Local Helper.exe'
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) { throw "installed helper not found: $helper" }
          Start-Process -FilePath $helper -ArgumentList '--background'
          $fixture = (Get-ChildItem apps/local-model-runtime/tests/fixtures -Filter *.wav | Select-Object -First 1).FullName
          node apps/local-helper/scripts/smoke-installed-helper.cjs $fixture
          Start-Process -FilePath $helper -ArgumentList '--uninstall' -Wait
          Get-Process -Name 'KP Local Helper' -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process -Name node -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force

      - name: Validate release files and generate latest.json
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          $installer = "apps/local-helper/release/KP-Local-Helper-Setup-$env:RELEASE_VERSION-x64.exe"
          $required = @($installer, "$installer.blockmap", 'apps/local-helper/release/latest.yml')
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "release file not found: $file" }
          }
          node apps/local-helper/scripts/generate-release-manifest.cjs `
            --file $installer `
            --version $env:RELEASE_VERSION `
            --protocol-version 0.1.2 `
            --base-url $env:KP_HELPER_PUBLISH_URL `
            --output apps/local-helper/release/latest.json

      - name: Retain GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: kp-local-helper-windows-x64-${{ needs.release-gate.outputs.version }}
          path: |
            apps/local-helper/release/KP-Local-Helper-Setup-*.exe
            apps/local-helper/release/KP-Local-Helper-Setup-*.exe.blockmap
            apps/local-helper/release/latest.yml
            apps/local-helper/release/latest.json
          if-no-files-found: error

      - name: Upload release to Qiniu and verify CDN
        env:
          KP_QINIU_ACCESS_KEY: ${{ secrets.KP_QINIU_ACCESS_KEY }}
          KP_QINIU_SECRET_KEY: ${{ secrets.KP_QINIU_SECRET_KEY }}
          RELEASE_VERSION: ${{ needs.release-gate.outputs.version }}
        run: >-
          node apps/local-helper/scripts/publish-qiniu-release.cjs
          --release-dir apps/local-helper/release
          --version "$env:RELEASE_VERSION"
          --bucket "$env:KP_QINIU_BUCKET"
          --prefix "$env:KP_QINIU_PREFIX"
          --domain "$env:KP_QINIU_DOMAIN"
          --upload-host "$env:KP_QINIU_UPLOAD_HOST"

      - name: Remove private build configuration
        if: ${{ always() }}
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue apps/local-helper/build.local.json

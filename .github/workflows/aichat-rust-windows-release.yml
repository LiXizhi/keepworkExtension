name: AIChat Rust release packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/aichat-rust/**"
      - "apps/mcp-rust/**"
      - "apps/mcp-runtime/**"
      - "src/**"
      - "scripts/**"
      - "package*.json"
      - "docs/acceptance/rust-release-evidence.schema.json"
      - ".github/workflows/*rust*.yml"
      - ".github/skills/rust-release/**"

permissions:
  contents: read

concurrency:
  group: aichat-rust-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    uses: ./.github/workflows/rust-desktop-validation.yml

  build:
    needs: validate
    if: github.event_name != 'pull_request'
    name: Windows Rust (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    env:
      AICHAT_MCP_ENGINE: rust
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/aichat-rust/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release-${{ matrix.arch }}
          workspaces: |
            apps/mcp-rust -> target
            apps/aichat-rust/src-tauri -> target
      - name: Import the code-signing certificate
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Output '::warning::No Windows signing certificate configured; this build will be unsigned.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'keepwork-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $secure = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
            $certs = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure)
            $signers = @($certs | Where-Object {
              $_.HasPrivateKey -and ($_.EnhancedKeyUsageList.ObjectId -contains '1.3.6.1.5.5.7.3.3')
            })
            if ($signers.Count -ne 1) { throw 'Expected exactly one code-signing certificate with a private key' }
            $cert = $signers[0]
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = 'http://timestamp.digicert.com'
                tsp = $true
              }
            }
          } | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $env:RUNNER_TEMP 'tauri-signing.json')
          Write-Output "Signing as $($cert.Subject)"
      - name: Install frontend dependencies and check types
        working-directory: apps/aichat-rust
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm typecheck
      - name: Build and stage the matching Rust MCP runtime
        run: |
          cargo build --release --locked --manifest-path apps/mcp-rust/Cargo.toml --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign the staged MCP runtime
        if: env.WINDOWS_CERT_THUMBPRINT != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }
          $binary = "apps/mcp-rust/target/${{ matrix.target }}/release/keepwork-mcp.exe"
          & $signtool.FullName sign /sha1 $env:WINDOWS_CERT_THUMBPRINT /fd sha256 /tr http://timestamp.digicert.com /td sha256 $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $signtool.FullName verify /pa $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage the MCP runtime into resources
        run: |
          node apps/aichat-rust/scripts/bundle-mcp-rust.cjs --target ${{ matrix.target }} --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        shell: pwsh
        working-directory: apps/aichat-rust
        run: |
          $arguments = @('tauri', 'build', '--ci', '--target', '${{ matrix.target }}', '--bundles', 'nsis')
          $signing = Join-Path $env:RUNNER_TEMP 'tauri-signing.json'
          if (Test-Path $signing) { $arguments += @('--config', $signing) }
          & pnpm @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extract and verify the installer payload
        run: |
          $version = (Get-Content apps/aichat-rust/package.json | ConvertFrom-Json).version
          $installer = "apps/aichat-rust/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/Keepwork_${version}_${{ matrix.arch }}-setup.exe"
          $extract = Join-Path $env:RUNNER_TEMP 'keepwork-payload'
          & 'C:\Program Files\7-Zip\7z.exe' x $installer "-o$extract" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $application = @(Get-ChildItem $extract -File -Recurse | Where-Object { $_.Name -in @('Keepwork.exe', 'aichat-rust.exe') })
          if ($application.Count -ne 1) { throw 'Expected one desktop executable' }
          $productVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($application[0].FullName).ProductVersion
          if ($productVersion -ne $version) { throw "Desktop version mismatch: $productVersion" }
          New-Item -ItemType Directory -Force release-packages | Out-Null
          node apps/aichat-rust/scripts/verify-windows-release.cjs --directory $extract --arch ${{ matrix.arch }} --commit $env:GITHUB_SHA --binary "apps/mcp-rust/target/${{ matrix.target }}/release/keepwork-mcp.exe" --installer $installer --output "release-packages/release-manifest-${version}-${{ matrix.arch }}.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $installer release-packages/
      - name: Verify every shipped binary is signed
        if: env.WINDOWS_CERT_THUMBPRINT != ''
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP 'keepwork-payload'
          $version = (Get-Content apps/aichat-rust/package.json | ConvertFrom-Json).version
          $files = @(Get-ChildItem $extract -Recurse -Include Keepwork.exe, aichat-rust.exe, keepwork-mcp.exe, keepwork-installer-helper.exe, uninstall.exe)
          $files += Get-Item "apps/aichat-rust/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/Keepwork_${version}_${{ matrix.arch }}-setup.exe"
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_CERT_THUMBPRINT) {
              throw "Unsigned release file: $($file.FullName) ($($signature.Status))"
            }
          }
          Write-Output "Verified $($files.Count) signed release files"
      - name: Remove signing certificate
        if: always() && env.WINDOWS_CERT_THUMBPRINT != ''
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:WINDOWS_CERT_THUMBPRINT" -Force
      - name: Smoke test the packaged x64 daemon
        if: matrix.arch == 'x64'
        run: |
          $runtime = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'keepwork-payload') -Filter keepwork-mcp.exe -Recurse)
          if ($runtime.Count -ne 1) { throw 'Expected one daemon executable' }
          node apps/mcp-rust/scripts/smoke.cjs $runtime[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test x64 automatic overwrite in an isolated installation
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $version = (Get-Content apps/aichat-rust/package.json | ConvertFrom-Json).version
          ./apps/aichat-rust/scripts/windows-self-update-smoke.ps1 -Installer "apps/aichat-rust/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/Keepwork_${version}_${{ matrix.arch }}-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: aichat-rust-windows-${{ matrix.arch }}-rust
          path: release-packages/*
          if-no-files-found: error

  build-macos:
    needs: validate
    if: github.event_name != 'pull_request'
    name: macOS Rust (universal)
    runs-on: macos-latest
    env:
      AICHAT_MCP_ENGINE: rust
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/aichat-rust/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-release-universal
          workspaces: |
            apps/mcp-rust -> target
            apps/aichat-rust/src-tauri -> target
      - name: Install frontend dependencies and check types
        working-directory: apps/aichat-rust
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
      - name: Build and stage the universal Rust MCP runtime
        run: node apps/aichat-rust/scripts/bundle-mcp-rust.cjs --target universal-apple-darwin
      - name: Build macOS universal app and DMG
        working-directory: apps/aichat-rust
        env:
          # Seal the bundle for updater integrity checks; not Developer ID notarization.
          APPLE_SIGNING_IDENTITY: '-'
        run: pnpm tauri build --ci --target universal-apple-darwin --bundles app,dmg
      - name: Verify the universal binary and its bundled runtime
        working-directory: apps/aichat-rust
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Keepwork.app"
          codesign --verify --deep --strict "$APP"
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/Keepwork")
          echo "Detected architectures: $ARCHS"
          echo "$ARCHS" | grep -q "x86_64"
          echo "$ARCHS" | grep -q "arm64"
          for slice in arm64 x64; do
            test -f "$APP/Contents/Resources/resources/mcp-runtime/$slice/runtime.json"
            test -x "$APP/Contents/Resources/resources/mcp-runtime/$slice/bin/keepwork-mcp"
          done
          for dmg in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg"
          done
      - name: Collect release packages
        run: |
          mkdir -p release-packages
          cp apps/aichat-rust/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release-packages/
      - uses: actions/upload-artifact@v4
        with:
          name: aichat-rust-macos-universal-rust
          path: release-packages/*
          if-no-files-found: error

  prepare-release:
    name: Prepare assets for the local publisher
    needs: [build, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/aichat-rust-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve release version
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node apps/aichat-rust/scripts/publish-release.cjs --version-from-tag "$TAG")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Check release publication contracts
        run: node --test scripts/rust-local-release.test.cjs apps/aichat-rust/tests/release-tags.test.cjs apps/aichat-rust/tests/release-publication.test.cjs apps/aichat-rust/tests/automatic-update-publication.test.cjs
      - uses: actions/download-artifact@v4
        with:
          pattern: aichat-rust-*-rust
          path: dist
          merge-multiple: true
      - name: Collect assets and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${{ steps.release.outputs.version }}"
          ls -l dist
          node apps/aichat-rust/scripts/publish-release.cjs --release-dir dist --version "$version" --tag "$TAG" --dry-run
          (cd dist && shasum -a 256 *.exe *.dmg release-manifest-${version}-*.json) > "dist/SHA256SUMS-${version}.txt"
          cat "dist/SHA256SUMS-${version}.txt"
      # CDN publication runs on the operator's device after a proxied download.
      - uses: actions/upload-artifact@v4
        with:
          name: aichat-rust-release-packages
          path: dist/*
          compression-level: 0
          if-no-files-found: error

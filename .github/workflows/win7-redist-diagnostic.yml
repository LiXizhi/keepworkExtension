name: Verify legacy Windows build prerequisites

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
          toolset: '14.44'
          sdk: '10.0.22621.0'
      - name: Build and audit the actual legacy launcher with the pinned toolchain
        shell: pwsh
        run: |
          @'
          const fs = require('node:fs'), crypto = require('node:crypto');
          const { keyHeader } = require('./apps/aichat-rust/scripts/cef-release.cjs');
          const key = crypto.generateKeyPairSync('rsa', { modulusLength: 2048 }).privateKey;
          fs.writeFileSync('diagnostic-key.hpp', keyHeader(key));
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $header = (Resolve-Path diagnostic-key.hpp).Path
          cmake -S apps/aichat-rust/windows -B launcher-diagnostic -G "Visual Studio 17 2022" -A x64 -T "v143,version=14.44" -DCMAKE_SYSTEM_VERSION=10.0.22621.0 -DCMAKE_EXE_LINKER_FLAGS=/MAP -DKEEPWORK_WIN7_EDITION=ON "-DKEEPWORK_PUBLIC_KEY_HEADER=$header"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $miniz = Get-Content launcher-diagnostic/_deps/miniz-build/miniz.vcxproj -Raw
          if (-not $miniz.Contains('_WIN32_WINNT=0x0601') -or -not $miniz.Contains('WINVER=0x0601')) {
            throw 'The legacy baseline must reach the actual miniz compilation'
          }
          cmake --build launcher-diagnostic --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir launcher-diagnostic -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/lib/windows7-pe.cjs launcher-diagnostic/Release --output launcher-diagnostic/pe-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-launcher-toolchain-diagnostic
          path: |
            launcher-diagnostic/Release/*.exe
            launcher-diagnostic/Release/*.map
            launcher-diagnostic/CMakeCache.txt
            launcher-diagnostic/pe-report.json
          if-no-files-found: warn
          retention-days: 30
  signature:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the pinned official SDK DLL without executing or publishing it
        shell: pwsh
        run: |
          @'
          import importlib.util
          from pathlib import Path
          import tempfile
          spec = importlib.util.spec_from_file_location('redist', 'apps/aichat-rust/scripts/prepare-win7-cef.py')
          redist = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(redist)
          with tempfile.TemporaryDirectory(dir='.') as root:
              root = Path(root)
              archive = redist.download(root / 'cache')
              directory = root / 'extracted'
              directory.mkdir()
              data = redist.extract(archive, directory)
              dll = directory / 'd3dcompiler_47.dll'
              dll.write_bytes(data)
              failures = 0
              for name, candidate in [('relative', dll), ('absolute', dll.resolve())]:
                  try:
                      redist.verify_authenticode(candidate)
                      print(name + ': pinned Microsoft SDK DLL native Authenticode validation passed')
                  except Exception as error:
                      failures += 1
                      print(name + ': ' + str(error))
              if failures:
                  raise RuntimeError('Native signature diagnostic failed for ' + str(failures) + ' path forms')
          '@ | python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

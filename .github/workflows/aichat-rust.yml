name: AIChat Rust Desktop (Tauri 2)

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "apps/aichat-rust/**"
      - "apps/mcp-rust/**"
      - "src/core/**"
      - "src/pet/**"
      - ".github/workflows/aichat-rust.yml"

jobs:
  build-macos-universal:
    name: Build macOS Universal (arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: apps/aichat-rust/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # runtime::tests::staged_node_bundle_is_readable_by_rust_on_macos_and_windows
      # runs apps/mcp-runtime/scripts/stage-runtime.cjs, so the runtime's
      # devDependencies must exist before `pnpm check` runs `cargo test`.
      - name: Install MCP runtime deps required by cargo tests
        run: npm ci --prefix apps/mcp-runtime
      - name: Install dependencies & run checks
        working-directory: apps/aichat-rust
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm smoke
      - name: Build macOS Universal app and DMG with Rust MCP
        working-directory: apps/aichat-rust
        run: pnpm make:mac
      - name: Verify Universal binary architectures and DMG
        working-directory: apps/aichat-rust
        run: |
          APP_BIN="src-tauri/target/universal-apple-darwin/release/bundle/macos/Keepwork.app/Contents/MacOS/Keepwork"
          ARCHS=$(lipo -archs "$APP_BIN")
          echo "Detected architectures: $ARCHS"
          echo "$ARCHS" | grep -q "x86_64"
          echo "$ARCHS" | grep -q "arm64"
          for slice in arm64 x64; do
            RUNTIME_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos/Keepwork.app/Contents/Resources/resources/mcp-runtime/$slice"
            node -e 'const fs = require("node:fs"); const m = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (m.engine !== "rust" || m.product !== "keepwork-mcp-runtime") process.exit(1)' "$RUNTIME_DIR/runtime.json"
            test -x "$RUNTIME_DIR/bin/keepwork-mcp"
          done
          for dmg in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: aichat-rust-macos-universal
          path: |
            apps/aichat-rust/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/aichat-rust/src-tauri/target/universal-apple-darwin/release/bundle/macos/Keepwork.app

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            script: make:win:x64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            script: make:win:arm64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: apps/aichat-rust/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies & run checks
        working-directory: apps/aichat-rust
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
      - name: Build Windows NSIS installer with Rust MCP (${{ matrix.target }})
        working-directory: apps/aichat-rust
        run: pnpm run ${{ matrix.script }}
      - name: Verify bundled Rust MCP
        shell: pwsh
        run: |
          $runtime = "apps/aichat-rust/src-tauri/resources/mcp-runtime/${{ matrix.arch }}"
          $manifest = Get-Content "$runtime/runtime.json" -Raw | ConvertFrom-Json
          if ($manifest.engine -ne 'rust' -or $manifest.product -ne 'keepwork-mcp-runtime') { throw 'Expected Rust MCP runtime' }
          if (-not (Test-Path "$runtime/bin/keepwork-mcp.exe")) { throw 'Rust MCP executable is missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: aichat-rust-windows-${{ matrix.arch }}
          path: |
            apps/aichat-rust/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe

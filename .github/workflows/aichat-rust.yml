name: AIChat Rust Desktop (Tauri 2)

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "apps/aichat-rust/**"
      - "src/core/**"
      - "src/pet/**"
      - ".github/workflows/aichat-rust.yml"

jobs:
  build-macos-universal:
    name: Build macOS Universal (arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: apps/aichat-rust/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install dependencies & run checks
        working-directory: apps/aichat-rust
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm smoke
      - name: Stage the bundled Keepwork MCP runtime
        env:
          KP_RUNTIME_NODE_VERSION: 22.23.2
        run: |
          npm ci
          npm ci --prefix apps/mcp-runtime
          npm ci --prefix apps/pet-companion
          npm run prepare:runtime --prefix apps/pet-companion
          npm run stage --prefix apps/mcp-runtime -- --platform darwin --arch arm64
          npm run stage --prefix apps/mcp-runtime -- --platform darwin --arch x64
          npm run smoke --prefix apps/mcp-runtime
      - name: Build macOS Universal app and DMG
        working-directory: apps/aichat-rust
        run: pnpm make:mac
      - name: Verify Universal binary architectures and DMG
        working-directory: apps/aichat-rust
        run: |
          APP_BIN="src-tauri/target/universal-apple-darwin/release/bundle/macos/Keepwork.app/Contents/MacOS/aichat-rust"
          ARCHS=$(lipo -archs "$APP_BIN")
          echo "Detected architectures: $ARCHS"
          echo "$ARCHS" | grep -q "x86_64"
          echo "$ARCHS" | grep -q "arm64"
          for slice in arm64 x64; do
            test -f "src-tauri/target/universal-apple-darwin/release/bundle/macos/Keepwork.app/Contents/Resources/resources/mcp-runtime/$slice/runtime.json"
          done
          for dmg in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            hdiutil verify "$dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: aichat-rust-macos-universal
          path: |
            apps/aichat-rust/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/aichat-rust/src-tauri/target/universal-apple-darwin/release/bundle/macos/Keepwork.app

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            script: make:win:x64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            script: make:win:arm64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: apps/aichat-rust/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies & run checks
        working-directory: apps/aichat-rust
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
      - name: Stage the bundled Keepwork MCP runtime (x64)
        if: matrix.arch == 'x64'
        env:
          KP_RUNTIME_NODE_VERSION: 22.23.2
        run: |
          npm ci
          npm ci --prefix apps/mcp-runtime
          npm ci --prefix apps/pet-companion
          npm run prepare:runtime --prefix apps/pet-companion
          npm run stage --prefix apps/mcp-runtime -- --platform win32 --arch x64
          npm run smoke --prefix apps/mcp-runtime
      - name: Build Windows NSIS installer (${{ matrix.target }})
        working-directory: apps/aichat-rust
        run: pnpm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: aichat-rust-windows-${{ matrix.arch }}
          path: |
            apps/aichat-rust/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
